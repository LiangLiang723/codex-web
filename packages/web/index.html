<!doctype html>
<html lang="en" class="dark" data-zcode-bootstrap-theme="dark" data-zcode-browser-theme-surface="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/codex-bot-dark.svg?v=4" data-codex-bot-favicon />
    <title>Codex Web</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-zcode-bootstrap-theme="light"] body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-zcode-browser-theme-surface],
      html[data-zcode-browser-theme-surface] body,
      html[data-zcode-browser-theme-surface] #root {
        /* 修复原因：共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--zcode-bootstrap-bg, #161616)) !important;
      }

      html[data-zcode-browser-theme-surface="light"],
      html[data-zcode-browser-theme-surface="light"] body,
      html[data-zcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--zcode-bootstrap-bg, #f8f8f8)) !important;
      }

      #zcode-web-app {
        display: contents;
      }

      #zcode-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 1;
      }

      #zcode-boot-screen + #zcode-web-app .zcode-boot-loading {
        visibility: hidden;
      }

      .zcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* Bugfix: UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。 */
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-zcode-bootstrap-theme="light"] .zcode-boot-loading {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .zcode-boot-loading__mark {
        display: grid;
        width: 72px;
        height: 72px;
        color: var(--codex-bot-color, #fff);
      }

      html[data-zcode-bootstrap-theme="light"] .zcode-boot-loading__mark {
        color: var(--codex-bot-color, #161616);
      }

      .zcode-boot-loading__mark > span {
        grid-area: 1 / 1;
      }

      .zcode-boot-loading__logo {
        background: currentColor;
        mask: url("/codex-bot-dark.svg") center / contain no-repeat;
        animation: zcode-boot-bob 1.5s ease-in-out infinite;
      }

      .zcode-boot-loading__anatomy {
        visibility: hidden;
      }

      .zcode-boot-loading__mark[data-bot-engine="anatomy"] .zcode-boot-loading__anatomy {
        visibility: visible;
      }

      .zcode-boot-loading__mark[data-bot-engine="anatomy"] .zcode-boot-loading__logo {
        visibility: hidden;
        animation: none;
      }

      @keyframes zcode-boot-bob {
        0%, 100% { transform: translateY(2px) rotate(-7deg); }
        50% { transform: translateY(-4px) rotate(7deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .zcode-boot-loading__logo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Bugfix: 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。 -->
      <div
        id="zcode-boot-screen"
        class="zcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <span class="zcode-boot-loading__mark" aria-hidden="true">
          <span class="zcode-boot-loading__logo"></span>
          <span class="zcode-boot-loading__anatomy"></span>
        </span>
      </div>
      <div id="zcode-web-app"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
